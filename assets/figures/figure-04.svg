<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d"><title id="t">Fig. 04.1 What each public record shows</title><desc id="d">Four stages of a public NOPSEMA record, with what each shows and does not establish, plus title surrender and enforcement notices as separate decisions. Endura Decommissioning, Field Note 04.</desc>
<rect width="1200" height="700" fill="#FAF7F1"/>
<text x="60" y="70" style="font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:2px" fill="#5F5B55">FIG. 04.1 · WHAT EACH PUBLIC RECORD SHOWS</text>
<line x1="60" y1="100" x2="1140" y2="100" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="60.0" y="132" style="font-family:'IBM Plex Mono',monospace;font-size:14px" fill="#A84D0E">01</text>
<text x="60.0" y="162" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:20px;font-weight:600" fill="#1A1A1A">Published for comment</text>
<text x="60.0" y="200" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px" fill="#1A1A1A">SHOWS</text>
<text x="60.0" y="224" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">A proposal exists and is open</text>
<text x="60.0" y="246" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">for comment.</text>
<line x1="60.0" y1="318" x2="290.0" y2="318" stroke="#CBC5BA" stroke-dasharray="4 4"/>
<text x="60.0" y="340" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px" fill="#A84D0E">DOES NOT ESTABLISH</text>
<text x="60.0" y="364" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">That NOPSEMA has assessed or</text>
<text x="60.0" y="386" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">accepted it.</text>
<line x1="330.0" y1="100" x2="330.0" y2="470" stroke="#E1DCD2"/>
<text x="348.0" y="132" style="font-family:'IBM Plex Mono',monospace;font-size:14px" fill="#A84D0E">02</text>
<text x="348.0" y="162" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:20px;font-weight:600" fill="#1A1A1A">Assessment outcome</text>
<text x="348.0" y="200" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px" fill="#1A1A1A">SHOWS</text>
<text x="348.0" y="224" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">Acceptance of the plan for</text>
<text x="348.0" y="246" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">that activity, within its</text>
<text x="348.0" y="268" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">boundaries, commitments and</text>
<text x="348.0" y="290" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">exclusions.</text>
<line x1="348.0" y1="318" x2="578.0" y2="318" stroke="#CBC5BA" stroke-dasharray="4 4"/>
<text x="348.0" y="340" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px" fill="#A84D0E">DOES NOT ESTABLISH</text>
<text x="348.0" y="364" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">Acceptance of other phases, or</text>
<text x="348.0" y="386" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">of work across the whole</text>
<text x="348.0" y="408" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">field.</text>
<line x1="600.0" y1="100" x2="600.0" y2="470" stroke="#E1DCD2"/>
<text x="618.0" y="132" style="font-family:'IBM Plex Mono',monospace;font-size:14px" fill="#A84D0E">03</text>
<text x="618.0" y="162" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:20px;font-weight:600" fill="#1A1A1A">Notified commencement</text>
<text x="618.0" y="200" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px" fill="#1A1A1A">SHOWS</text>
<text x="618.0" y="224" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">The titleholder notified that</text>
<text x="618.0" y="246" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">the activity started.</text>
<line x1="618.0" y1="318" x2="848.0" y2="318" stroke="#CBC5BA" stroke-dasharray="4 4"/>
<text x="618.0" y="340" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px" fill="#A84D0E">DOES NOT ESTABLISH</text>
<text x="618.0" y="364" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">That the work was completed.</text>
<line x1="870.0" y1="100" x2="870.0" y2="470" stroke="#E1DCD2"/>
<text x="888.0" y="132" style="font-family:'IBM Plex Mono',monospace;font-size:14px" fill="#A84D0E">04</text>
<text x="888.0" y="162" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:20px;font-weight:600" fill="#1A1A1A">Completion evidence</text>
<text x="888.0" y="200" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px" fill="#1A1A1A">SHOWS</text>
<text x="888.0" y="224" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">Only what its own record</text>
<text x="888.0" y="246" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">states.</text>
<line x1="888.0" y1="318" x2="1118.0" y2="318" stroke="#CBC5BA" stroke-dasharray="4 4"/>
<text x="888.0" y="340" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px" fill="#A84D0E">DOES NOT ESTABLISH</text>
<text x="888.0" y="364" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">Anything by inference from the</text>
<text x="888.0" y="386" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:16px" fill="#45433F">earlier stages.</text>
<rect x="60.0" y="500" width="528.0" height="130" fill="#FFFDF9" stroke="#E1DCD2"/>
<text x="80.0" y="532" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:18px;font-weight:600" fill="#1A1A1A">Title surrender</text>
<text x="80.0" y="560" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:15px" fill="#45433F">Decided by the Joint Authority, with NOPSEMA advising under</text>
<text x="80.0" y="581" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:15px" fill="#45433F">its Section 270 policy. A different decision from accepting an</text>
<text x="80.0" y="602" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:15px" fill="#45433F">activity’s environment plan.</text>
<rect x="612.0" y="500" width="528.0" height="130" fill="#FFFDF9" stroke="#E1DCD2"/>
<text x="632.0" y="532" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:18px;font-weight:600" fill="#1A1A1A">Directions and notices</text>
<text x="632.0" y="560" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:15px" fill="#45433F">“Closed” means the duty holder has notified NOPSEMA of</text>
<text x="632.0" y="581" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:15px" fill="#45433F">compliance. It is not a statement about the asset’s current</text>
<text x="632.0" y="602" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:15px" fill="#45433F">condition.</text>
<text x="60" y="672" style="font-family:'IBM Plex Mono',monospace;font-size:13px" fill="#5F5B55">Endura Decommissioning · Field Note 04 · enduradecom.com</text></svg>